[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "furniture-center"
version = "0.1.0"
description = "Spatial furniture discovery and management"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "mcp[cli]>=2,<3",
    "openai>=1.68,<3",
    "openpyxl>=3.1,<4",
    "pillow>=10,<12",
    "pydantic-settings>=2.8,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
furniture-center-mcp = "mcp_server.__main__:main"
furniture-center-import-excel = "backend.import_excel:main"

[tool.hatch.build.targets.wheel]
packages = ["backend", "mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
